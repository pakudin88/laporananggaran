<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transparansi Anggaran - Warga Perum Green Land</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none; }
        
        /* Entrance animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        /* Hide table headers on mobile */
        @media (max-width: 768px) {
            .mobile-card-view thead {
                display: none;
            }
            .mobile-card-view tr {
                display: flex;
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid #f1f5f9; /* slate-100 */
                background-color: white;
                margin-bottom: 0.5rem;
                border-radius: 0.5rem;
                box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            }
            .mobile-card-view td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.25rem 0;
                border: none;
            }
            /* Add labels before data on mobile */
            .mobile-card-view td::before {
                content: attr(data-label);
                font-size: 0.75rem; /* text-xs */
                font-weight: 600; /* font-semibold */
                color: #64748b; /* slate-500 */
                text-transform: uppercase;
                margin-right: 1rem;
            }
            
            /* Specific styling for the row container in mobile */
            .mobile-card-container {
                background-color: transparent !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
            
            /* Footer mobile styling */
            .mobile-card-view tfoot tr {
                 flex-direction: row;
                 justify-content: space-between;
                 background-color: #f8fafc;
                 border-radius: 0 0 0.75rem 0.75rem;
                 margin-bottom: 0;
            }
            .mobile-card-view tfoot td {
                padding: 1rem;
            }
            .mobile-card-view tfoot td::before {
                display: none;
            }
            /* Hide the No column entirely on mobile, or style it specially */
            .mobile-card-view td.col-no { display: none; }
        }
        
        /* Desktop specific table styling */
        @media (min-width: 769px) {
            .mobile-card-view table {
                width: 100%;
                border-collapse: collapse;
            }
            .mobile-card-view th, .mobile-card-view td {
                padding: 1rem 1.5rem; /* px-6 py-4 */
                border-bottom: 1px solid #e2e8f0; /* slate-200 */
            }
            .mobile-card-view th {
                background-color: #f8fafc; /* slate-50 */
                color: #64748b; /* slate-500 */
                font-size: 0.75rem; /* text-xs */
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                text-align: left;
            }
            .mobile-card-view tbody tr:hover {
                background-color: #f8fafc; /* hover:bg-slate-50 */
            }
            .col-right { text-align: right !important; }
            .col-center { text-align: center !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12 font-sans antialiased">

    <!-- Header -->
    <header class="bg-[#2b88d8] bg-gradient-to-r from-[#2b88d8] to-[#1c6fae] text-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 md:p-3 rounded-full backdrop-blur-sm shrink-0">
                    <i class="fa-solid fa-faucet-drip text-xl md:text-2xl"></i>
                </div>
                <div class="flex flex-col justify-center">
                    <h1 class="text-base md:text-2xl font-bold leading-tight tracking-wide">Laporan Pipa Induk</h1>
                    <p class="text-blue-100 text-[11px] md:text-sm font-medium mt-0.5">Board Transparansi Anggaran</p>
                </div>
            </div>
            <!-- Tanggal Update -->
            <div class="bg-white/20 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-[10px] md:text-sm font-medium backdrop-blur-sm flex items-center justify-center shrink-0">
                <i class="fa-regular fa-clock mr-1 md:mr-2"></i> <span>Juni 2026</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-3 md:px-4 mt-6 md:mt-8">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-6 mb-6 md:mb-8">
            <!-- Pemasukan Card -->
            <div class="bg-white rounded-[20px] p-5 md:p-6 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] flex items-center gap-4 transform transition-all duration-300 animate-fade-in" style="animation-delay: 0.1s;">
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center text-xl md:text-2xl shrink-0">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
                <div>
                    <p class="text-[11px] md:text-sm text-slate-500 font-semibold mb-0.5 uppercase tracking-wider">Total Iuran</p>
                    <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-none" id="total-iuran">Rp 0</h2>
                </div>
            </div>

            <!-- Pengeluaran Card -->
            <div class="bg-white rounded-[20px] p-5 md:p-6 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] flex items-center gap-4 transform transition-all duration-300 animate-fade-in" style="animation-delay: 0.2s;">
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-xl md:text-2xl shrink-0">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
                <div>
                    <p class="text-[11px] md:text-sm text-slate-500 font-semibold mb-0.5 uppercase tracking-wider">Pengeluaran</p>
                    <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-none" id="total-pengeluaran">Rp 0</h2>
                </div>
            </div>

            <!-- Saldo Card -->
            <div class="bg-white rounded-[20px] p-5 md:p-6 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] flex items-center gap-4 relative overflow-hidden transform transition-all duration-300 animate-fade-in" id="saldo-card" style="animation-delay: 0.3s;">
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl md:text-2xl shrink-0 transition-colors duration-300" id="saldo-icon-container">
                    <i class="fa-solid fa-triangle-exclamation" id="saldo-icon"></i>
                </div>
                <div class="pr-16 md:pr-0">
                    <p class="text-[11px] md:text-sm text-slate-500 font-semibold mb-0.5 uppercase tracking-wider">Sisa Saldo</p>
                    <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-none transition-colors duration-300" id="total-saldo">Rp 0</h2>
                </div>
                <!-- Status Badge -->
                <div class="absolute top-1/2 -translate-y-1/2 right-4 md:top-5 md:translate-y-0 md:right-5" id="saldo-badge">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <!-- TAB CONTENT: PENGELUARAN -->
        <div id="tab-pengeluaran" class="bg-transparent md:bg-white md:rounded-2xl md:shadow-sm md:border md:border-slate-100 overflow-hidden animate-fade-in" style="animation-delay: 0.4s;">
            
            <div class="p-4 md:p-6 bg-white rounded-t-2xl md:rounded-none flex flex-row justify-between items-center gap-2 mb-2 md:mb-0 border-b border-slate-100">
                <h3 class="text-base md:text-lg font-bold text-slate-800">Detail Pengeluaran</h3>
                <div class="bg-rose-50 text-rose-500 px-3 py-1 rounded-full text-xs font-bold border border-rose-100">
                    <span id="count-pengeluaran">0</span> Item
                </div>
            </div>

            <!-- Tabel yang berubah jadi List di HP -->
            <div class="mobile-card-view w-full">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th class="w-10 text-center">No</th>
                            <th class="w-28">Tanggal</th>
                            <th>Keterangan Barang</th>
                            <th class="col-right">Harga Satuan</th>
                            <th class="col-center">Jumlah</th>
                            <th class="col-right">Total Nominal</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-pengeluaran" class="text-sm">
                        <!-- Rows injected by JS -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="5" class="text-right font-bold text-slate-700 text-sm md:text-base hidden md:table-cell">Total Pengeluaran:</td>
                            <td class="md:hidden font-bold text-slate-700 text-sm">Total:</td>
                            <td class="col-right font-bold text-slate-800 text-base md:text-lg" id="footer-total-pengeluaran">Rp 0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <footer class="text-center text-slate-400 text-[11px] md:text-sm mt-8 pb-8">
        <p>Aplikasi Laporan Transparansi Anggaran &copy; 2026</p>
    </footer>

    <!-- Application Logic -->
    <script>
        // Data Source
        const dataIuran = [
            { tgl: '04/06/2026', ket: 'Tanpa Nama 1', nominal: 850000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 2', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 3', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 4', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 5', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 6', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 7', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 8', nominal: 420000, metode: 'Cash' },
            { tgl: '06/06/2026', ket: 'Tanpa Nama 9', nominal: 420000, metode: 'Transfer' },
            { tgl: '06/06/2026', ket: 'Tanpa Nama 10', nominal: 420000, metode: 'Transfer' },
        ];

        const dataPengeluaran = [
            { tgl: '06/06/2026', ket: 'Rucika AW 2 dem', hg: 112000, qty: 18, total: 2016000 },
            { tgl: '06/06/2026', ket: 'Operloop 2 dem to 3/4', hg: 12000, qty: 17, total: 204000 },
            { tgl: '06/06/2026', ket: 'T 2 dem', hg: 12500, qty: 17, total: 212500 },
            { tgl: '06/06/2026', ket: 'Keni 2 dem', hg: 9000, qty: 2, total: 18000 },
            { tgl: '06/06/2026', ket: 'Lem Ruglue', hg: 60000, qty: 1, total: 60000 },
            { tgl: '06/06/2026', ket: 'G.Sanflex', hg: 18500, qty: 1, total: 18500 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4', hg: 5000, qty: 20, total: 100000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4', hg: 5000, qty: 10, total: 50000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 2 dem', hg: 9000, qty: 4, total: 36000 },
            { tgl: '06/06/2026', ket: 'overloop 3x2', hg: 12500, qty: 1, total: 12500 },
            { tgl: '06/06/2026', ket: 'Rucika 3/4', hg: 37000, qty: 15, total: 555000 },
            { tgl: '06/06/2026', ket: 'TE Rucika 3/4', hg: 6000, qty: 8, total: 48000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4', hg: 3000, qty: 6, total: 18000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4', hg: 2000, qty: 3, total: 6000 },
            { tgl: '06/06/2026', ket: 'Rucika 3/4', hg: 37000, qty: 6, total: 222000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4 2pcs @6000', hg: 6000, qty: 2, total: 12000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4 2pcs @3000', hg: 3000, qty: 2, total: 6000 },
            { tgl: '06/06/2026', ket: 'Bensin Untuk Tossa', hg: 15000, qty: 1, total: 15000 },
            { tgl: '06/06/2026', ket: 'T Panuloh', hg: 4500, qty: 4, total: 18000 },
            { tgl: '06/06/2026', ket: 'Keni 3/4 12pcs @4000', hg: 4000, qty: 12, total: 48000 },
            { tgl: '06/06/2026', ket: 'Lev PVC 2 pcs @10000', hg: 10000, qty: 2, total: 20000 },
            { tgl: '06/06/2026', ket: 'Jasa Instalasi Pipa Induk borongan', hg: 1500000, qty: 1, total: 1500000 },
            { tgl: '06/06/2026', ket: 'Rokok Surya 16', hg: 38000, qty: 1, total: 38000 },
            { tgl: '07/06/2026', ket: 'PVC 2 dem Rucika', hg: 112000, qty: 2, total: 224000 },
            { tgl: '07/06/2026', ket: 'PVC 1 dem Rucika', hg: 50000, qty: 1, total: 50000 },
            { tgl: '07/06/2026', ket: 'Keni 2 dem', hg: 9000, qty: 2, total: 18000 },
            { tgl: '07/06/2026', ket: 'Keni 1 dem', hg: 3000, qty: 1, total: 3000 },
            { tgl: '07/06/2026', ket: 'overloop 2 dem ke 1 dem', hg: 12000, qty: 1, total: 12000 },
            { tgl: '07/06/2026', ket: 'DOP 3/4', hg: 2000, qty: 10, total: 20000 },
            { tgl: '07/06/2026', ket: 'Overloop 1 dem to 3/4', hg: 4000, qty: 1, total: 4000 },
            { tgl: '07/06/2026', ket: 'Stop Kran 1 dem', hg: 30000, qty: 1, total: 30000 },
            { tgl: '07/06/2026', ket: 'T 1 dem', hg: 5000, qty: 1, total: 5000 },
            { tgl: '07/06/2026', ket: 'Sokdrat 3/4', hg: 4000, qty: 1, total: 4000 },
            { tgl: '07/06/2026', ket: 'Kran 3/4', hg: 18000, qty: 1, total: 18000 },
        ];

        // Format Currency Function
        const formatRupiah = (number) => {
            // Hilangkan "Rp" bawaan dari Intl.NumberFormat agar lebih mudah disesuaikan, kita pakai prefix manual
            const formatter = new Intl.NumberFormat('id-ID', {
                minimumFractionDigits: 0
            });
            return 'Rp ' + formatter.format(number);
        };

        // Initialize App
        function initApp() {
            // Hitung Total Iuran (Tanpa render tabel ke HTML)
            let totalIuran = 0;
            dataIuran.forEach((item) => {
                totalIuran += item.nominal;
            });

            // Render Pengeluaran Table (Responsive Card Style)
            const tbodyPengeluaran = document.getElementById('tbody-pengeluaran');
            let totalPengeluaran = 0;

            dataPengeluaran.forEach((item, index) => {
                totalPengeluaran += item.total;
                const tr = document.createElement('tr');
                // Format HTML disesuaikan dengan CSS baru. data-label digunakan untuk HP
                tr.innerHTML = `
                    <td data-label="No" class="col-no text-center text-slate-500">${index + 1}</td>
                    <td data-label="Tanggal" class="text-slate-500 text-xs md:text-sm md:w-28">${item.tgl}</td>
                    <td data-label="Keterangan" class="font-medium text-slate-700">${item.ket}</td>
                    <td data-label="Harga Satuan" class="col-right text-slate-600">${formatRupiah(item.hg)}</td>
                    <td data-label="Jumlah" class="col-center">
                        <span class="inline-block bg-slate-100 text-slate-700 py-0.5 px-2 rounded font-medium text-xs">${item.qty} x</span>
                    </td>
                    <td data-label="Total" class="col-right font-medium text-slate-800">${formatRupiah(item.total)}</td>
                `;
                tbodyPengeluaran.appendChild(tr);
            });

            // Calculate Totals & Saldo
            const saldoAkhir = totalIuran - totalPengeluaran;

            // Update UI Elements
            document.getElementById('total-iuran').textContent = formatRupiah(totalIuran);

            document.getElementById('total-pengeluaran').textContent = formatRupiah(totalPengeluaran);
            document.getElementById('footer-total-pengeluaran').textContent = formatRupiah(totalPengeluaran);
            document.getElementById('count-pengeluaran').textContent = dataPengeluaran.length;

            const elSaldo = document.getElementById('total-saldo');
            const elSaldoCard = document.getElementById('saldo-card');
            const elSaldoIconContainer = document.getElementById('saldo-icon-container');
            const elSaldoIcon = document.getElementById('saldo-icon');
            const elSaldoBadge = document.getElementById('saldo-badge');

            // Format khusus untuk saldo negatif
            if (saldoAkhir < 0) {
                elSaldo.textContent = '- ' + formatRupiah(Math.abs(saldoAkhir));
                elSaldo.classList.remove('text-slate-800');
                elSaldo.classList.add('text-rose-600');
                
                elSaldoIconContainer.classList.replace('bg-blue-100', 'bg-rose-100');
                elSaldoIconContainer.classList.replace('text-blue-600', 'text-rose-500');
                // Ikon defisit dari gambar
                elSaldoIcon.className = 'fa-solid fa-triangle-exclamation';

                elSaldoBadge.innerHTML = `<span class="bg-rose-100 text-rose-600 py-1 px-3 rounded-full text-[10px] md:text-xs font-bold">Defisit</span>`;
            } else {
                elSaldo.textContent = formatRupiah(saldoAkhir);
                elSaldoBadge.innerHTML = `<span class="bg-emerald-100 text-emerald-600 py-1 px-3 rounded-full text-[10px] md:text-xs font-bold">Aman</span>`;
            }
        }

        // Run Initialization on Load
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
