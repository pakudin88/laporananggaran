<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transparansi Anggaran - Warga Perum Green Land</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none; }
        
        /* Entrance animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Hide scrollbar for a cleaner mobile app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#f4f7fb] text-slate-800 min-h-screen font-sans antialiased selection:bg-brand-200 pb-10">

    <!-- App Header & Curved Backdrop -->
    <div class="bg-gradient-to-b from-[#2b88d8] to-[#1e73b5] pt-8 pb-24 px-5 rounded-b-[2rem] shadow-sm relative z-0">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 w-10 h-10 rounded-full backdrop-blur-md flex items-center justify-center text-white shrink-0 shadow-inner">
                    <i class="fa-solid fa-faucet-drip text-lg"></i>
                </div>
                <div>
                    <h1 class="text-white text-base font-bold tracking-wide">Perum Green Land</h1>
                    <p class="text-blue-100 text-[11px] font-medium mt-0.5">Laporan Pipa Induk Termin 2</p>
                </div>
            </div>
            <div class="bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-semibold text-white backdrop-blur-md border border-white/10 flex items-center shadow-inner">
                <i class="fa-regular fa-clock mr-1.5"></i> Jun 2026
            </div>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 -mt-16 relative z-10">
        
        <!-- Main Balance Card -->
        <div class="bg-white rounded-[1.25rem] p-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-4 animate-fade-in border border-slate-50" id="saldo-card" style="animation-delay: 0.1s;">
            <div class="flex justify-between items-start mb-2">
                <div class="flex items-center gap-2 text-slate-500">
                    <div class="w-6 h-6 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-[10px]" id="saldo-icon-container">
                        <i class="fa-solid fa-wallet" id="saldo-icon"></i>
                    </div>
                    <p class="text-xs font-semibold uppercase tracking-wider">Sisa Saldo</p>
                </div>
                <div id="saldo-badge">
                    <!-- Injected via JS -->
                </div>
            </div>
            <h2 class="text-[28px] font-extrabold text-slate-800 tracking-tight mt-1" id="total-saldo">Rp 0</h2>
        </div>

        <!-- Income & Expense Mini Cards -->
        <div class="grid grid-cols-2 gap-3 mb-6 animate-fade-in" style="animation-delay: 0.2s;">
            <!-- Pemasukan -->
            <div class="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-50">
                <div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-sm mb-3">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mb-1">Total Iuran</p>
                <h3 class="text-[15px] font-bold text-slate-800 truncate" id="total-iuran">Rp 0</h3>
            </div>

            <!-- Pengeluaran -->
            <div class="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-50">
                <div class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-sm mb-3">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mb-1">Pengeluaran</p>
                <h3 class="text-[15px] font-bold text-slate-800 truncate" id="total-pengeluaran">Rp 0</h3>
            </div>
        </div>

        <!-- Transaction List (App Style) -->
        <div class="animate-fade-in" style="animation-delay: 0.3s;">
            <div class="flex items-center justify-between mb-3 px-1">
                <h3 class="text-[15px] font-bold text-slate-800">Rincian Pengeluaran</h3>
                <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md text-[10px] font-bold">
                    <span id="count-pengeluaran">0</span> Item
                </span>
            </div>

            <!-- The List Container -->
            <div class="bg-white rounded-[1.25rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-50 overflow-hidden divide-y divide-slate-100" id="list-pengeluaran">
                <!-- List items injected by JS -->
            </div>

            <!-- Total Footer Card -->
            <div class="mt-4 bg-[#2b88d8] rounded-2xl p-4 shadow-md flex justify-between items-center text-white">
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-100">Total Pengeluaran</span>
                <span class="text-lg font-bold" id="footer-total-pengeluaran">Rp 0</span>
            </div>
        </div>
        
    </main>

    <!-- Application Logic -->
    <script>
        // Data Source
        const dataIuran = [
            { tgl: '04/06/2026', ket: 'Tanpa Nama 1', nominal: 850000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 2', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 3', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 4', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 5', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 6', nominal: 420000, metode: 'Transfer' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 7', nominal: 420000, metode: 'Cash' },
            { tgl: '05/06/2026', ket: 'Tanpa Nama 8', nominal: 420000, metode: 'Cash' },
            { tgl: '06/06/2026', ket: 'Tanpa Nama 9', nominal: 420000, metode: 'Transfer' },
            { tgl: '06/06/2026', ket: 'Tanpa Nama 10', nominal: 420000, metode: 'Transfer' },
        ];

        const dataPengeluaran = [
            { tgl: '06/06/2026', ket: 'Rucika AW 2 dem', hg: 112000, qty: 18, total: 2016000 },
            { tgl: '06/06/2026', ket: 'Operloop 2 dem to 3/4', hg: 12000, qty: 17, total: 204000 },
            { tgl: '06/06/2026', ket: 'T 2 dem', hg: 12500, qty: 17, total: 212500 },
            { tgl: '06/06/2026', ket: 'Keni 2 dem', hg: 9000, qty: 2, total: 18000 },
            { tgl: '06/06/2026', ket: 'Lem Ruglue', hg: 60000, qty: 1, total: 60000 },
            { tgl: '06/06/2026', ket: 'G.Sanflex', hg: 18500, qty: 1, total: 18500 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4', hg: 5000, qty: 20, total: 100000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4', hg: 5000, qty: 10, total: 50000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 2 dem', hg: 9000, qty: 4, total: 36000 },
            { tgl: '06/06/2026', ket: 'overloop 3x2', hg: 12500, qty: 1, total: 12500 },
            { tgl: '06/06/2026', ket: 'Rucika 3/4', hg: 37000, qty: 15, total: 555000 },
            { tgl: '06/06/2026', ket: 'TE Rucika 3/4', hg: 6000, qty: 8, total: 48000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4', hg: 3000, qty: 6, total: 18000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4', hg: 2000, qty: 3, total: 6000 },
            { tgl: '06/06/2026', ket: 'Rucika 3/4', hg: 37000, qty: 6, total: 222000 },
            { tgl: '06/06/2026', ket: 'Keni Rucika 3/4 2pcs @6000', hg: 6000, qty: 2, total: 12000 },
            { tgl: '06/06/2026', ket: 'DOP 3/4 2pcs @3000', hg: 3000, qty: 2, total: 6000 },
            { tgl: '06/06/2026', ket: 'Bensin Untuk Tossa', hg: 15000, qty: 1, total: 15000 },
            { tgl: '06/06/2026', ket: 'T Panuloh', hg: 4500, qty: 4, total: 18000 },
            { tgl: '06/06/2026', ket: 'Keni 3/4 12pcs @4000', hg: 4000, qty: 12, total: 48000 },
            { tgl: '06/06/2026', ket: 'Lev PVC 2 pcs @10000', hg: 10000, qty: 2, total: 20000 },
            { tgl: '06/06/2026', ket: 'Jasa Instalasi Pipa Induk borongan', hg: 1500000, qty: 1, total: 1500000 },
            { tgl: '06/06/2026', ket: 'Rokok Surya 16', hg: 38000, qty: 1, total: 38000 },
            { tgl: '07/06/2026', ket: 'PVC 2 dem Rucika', hg: 112000, qty: 2, total: 224000 },
            { tgl: '07/06/2026', ket: 'PVC 1 dem Rucika', hg: 50000, qty: 1, total: 50000 },
            { tgl: '07/06/2026', ket: 'Keni 2 dem', hg: 9000, qty: 2, total: 18000 },
            { tgl: '07/06/2026', ket: 'Keni 1 dem', hg: 3000, qty: 1, total: 3000 },
            { tgl: '07/06/2026', ket: 'overloop 2 dem ke 1 dem', hg: 12000, qty: 1, total: 12000 },
            { tgl: '07/06/2026', ket: 'DOP 3/4', hg: 2000, qty: 10, total: 20000 },
            { tgl: '07/06/2026', ket: 'Overloop 1 dem to 3/4', hg: 4000, qty: 1, total: 4000 },
            { tgl: '07/06/2026', ket: 'Stop Kran 1 dem', hg: 30000, qty: 1, total: 30000 },
            { tgl: '07/06/2026', ket: 'T 1 dem', hg: 5000, qty: 1, total: 5000 },
            { tgl: '07/06/2026', ket: 'Sokdrat 3/4', hg: 4000, qty: 1, total: 4000 },
            { tgl: '07/06/2026', ket: 'Kran 3/4', hg: 18000, qty: 1, total: 18000 },
        ];

        // Format Currency Function
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };

        // Initialize App
        function initApp() {
            // Calculate Total Iuran
            let totalIuran = 0;
            dataIuran.forEach((item) => {
                totalIuran += item.nominal;
            });

            // Render Pengeluaran as a List
            const listPengeluaran = document.getElementById('list-pengeluaran');
            let totalPengeluaran = 0;

            dataPengeluaran.forEach((item, index) => {
                totalPengeluaran += item.total;
                const div = document.createElement('div');
                div.className = 'p-4 flex items-center gap-3 hover:bg-slate-50 transition-colors cursor-default';
                
                // Extract date to simple format (e.g., "06/06") for cleaner UI if preferred, or keep full
                
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-slate-50 border border-slate-100 text-slate-400 flex items-center justify-center text-sm shrink-0">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[13px] md:text-sm font-semibold text-slate-800 truncate">${item.ket}</p>
                        <p class="text-[11px] text-slate-500 mt-0.5">${item.tgl} • ${item.qty} x ${formatRupiah(item.hg)}</p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="text-[13px] md:text-sm font-bold text-slate-800">${formatRupiah(item.total)}</p>
                    </div>
                `;
                listPengeluaran.appendChild(div);
            });

            // Calculate Totals & Saldo
            const saldoAkhir = totalIuran - totalPengeluaran;

            // Update UI Elements
            document.getElementById('total-iuran').textContent = formatRupiah(totalIuran);
            document.getElementById('total-pengeluaran').textContent = formatRupiah(totalPengeluaran);
            document.getElementById('footer-total-pengeluaran').textContent = formatRupiah(totalPengeluaran);
            document.getElementById('count-pengeluaran').textContent = dataPengeluaran.length;

            const elSaldo = document.getElementById('total-saldo');
            const elSaldoIconContainer = document.getElementById('saldo-icon-container');
            const elSaldoIcon = document.getElementById('saldo-icon');
            const elSaldoBadge = document.getElementById('saldo-badge');

            // Format Saldo Negatif (Defisit)
            if (saldoAkhir < 0) {
                // Remove "-" from number formatting, add it manually for clear "-Rp X.XXX" format
                const absoluteSaldo = Math.abs(saldoAkhir);
                elSaldo.textContent = '-' + formatRupiah(absoluteSaldo);
                
                elSaldo.classList.replace('text-slate-800', 'text-rose-600');
                
                elSaldoIconContainer.classList.replace('bg-blue-50', 'bg-rose-50');
                elSaldoIconContainer.classList.replace('text-blue-500', 'text-rose-500');
                elSaldoIcon.classList.replace('fa-wallet', 'fa-triangle-exclamation');

                elSaldoBadge.innerHTML = `<span class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide">Defisit</span>`;
            } else {
                elSaldo.textContent = formatRupiah(saldoAkhir);
                elSaldoBadge.innerHTML = `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide">Aman</span>`;
            }
        }

        // Run Initialization on Load
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
